<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirm Training Attendance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 520px;">
  <div class="card shadow-sm">
    <div class="card-body p-4" id="content">
      <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>
</div>

<script>
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function init() {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const content = document.getElementById('content');

  if (!token) {
    content.innerHTML = '<div class="alert alert-danger mb-0">Missing confirmation token. Please use the link provided by HR.</div>';
    return;
  }

  let data;
  try {
    const res = await fetch(`/api/confirm/${encodeURIComponent(token)}`);
    data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Invalid link');
  } catch (e) {
    content.innerHTML = `<div class="alert alert-danger mb-0">${escapeHtml(e.message)}</div>`;
    return;
  }

  const { nominee, training } = data;

  if (nominee.employee_confirmed) {
    content.innerHTML = `
      <div class="text-center">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
        <h5 class="mt-3">Attendance Already Confirmed</h5>
        <p class="text-muted mb-0">${escapeHtml(nominee.name)}, you've already confirmed your attendance for:</p>
        <p class="fw-semibold">${escapeHtml(training.name)}</p>
      </div>`;
    return;
  }

  content.innerHTML = `
    <h5 class="mb-1"><i class="bi bi-mortarboard-fill me-2"></i>${escapeHtml(training.name)}</h5>
    <p class="text-muted mb-3">${training.training_date} &middot; ${escapeHtml(training.venue || '')}</p>
    <p>Hello <strong>${escapeHtml(nominee.name)}</strong>, please confirm your attendance by entering your work email below.</p>
    <form id="confirmForm">
      <div class="mb-3">
        <label class="form-label">Work Email</label>
        <input type="email" class="form-control" name="work_email" required placeholder="you@company.com">
      </div>
      <button type="submit" class="btn btn-primary w-100">Confirm Attendance</button>
    </form>
    <div id="formMsg" class="mt-3"></div>
  `;

  document.getElementById('confirmForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const msg = document.getElementById('formMsg');
    msg.innerHTML = '';

    try {
      const res = await fetch(`/api/confirm/${encodeURIComponent(token)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_email: fd.get('work_email') }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Could not confirm attendance');
      init();
    } catch (err) {
      msg.innerHTML = `<div class="alert alert-danger mb-0">${escapeHtml(err.message)}</div>`;
    }
  });
}

init();
</script>
</body>
</html>
