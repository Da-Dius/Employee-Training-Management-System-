<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Nomination</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #111827;
    }

    p {
      color: #52525b;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-accept {
      background-color: #10b981;
      color: white;
    }

    .btn-accept:hover {
      background-color: #059669;
    }

    .btn-decline {
      background-color: #f3f4f6;
      color: #4b5563;
    }

    .btn-decline:hover {
      background-color: #e5e7eb;
    }

    .btn-submit {
      background-color: #ef4444;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #dc2626;
    }

    #decline-section {
      display: none;
      text-align: left;
      margin-top: 20px;
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 5px;
      color: #374151;
    }

    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      margin-bottom: 10px;
      resize: vertical;
    }

    .success {
      color: #10b981;
    }

    .error {
      color: #ef4444;
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1 id="title">Training Nomination</h1>
    <p id="message">Please confirm whether you will be attending this training program.</p>

    <div class="btn-group" id="action-buttons">
      <button class="btn-accept"
        onclick="showDeclineForm ? submitResponse('accept') : window.submitResponse('accept')">Accept
        Nomination</button>
      <button class="btn-decline"
        onclick="showDeclineForm ? showDeclineForm() : window.showDeclineForm()">Decline</button>
    </div>

    <div id="decline-section">
      <label for="reason">Reason for declining (Required):</label>
      <textarea id="reason" rows="3"
        placeholder="E.g., Pre-approved annual leave, conflicting urgent assignment..."></textarea>
      <button class="btn-submit"
        onclick="submitResponse ? submitResponse('decline') : window.submitResponse('decline')">Submit Decline</button>
    </div>
  </div>
  <!-- Link the external JS file here -->
  <script src="/confirm.js"></script>
</body>

</html>
